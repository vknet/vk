name: PR Check

on:
  pull_request_target:
    branches: [ develop ]

  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
        type: choice
        options:
          - info
          - warning
          - debug

permissions:
  contents: read

jobs:
  build:
    environment: VkNet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Test
        run: dotnet test VkNet.Tests/VkNet.Tests.csproj -c Release -f net10.0

      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.1.1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_TO }}
          format: markdown
          message: |
            **✅ Task Succeeded**

            `Reason: PullRequest Build №: ${{ github.run_number }} Pull Request для VkNet был успешно собран!`

            **Build queued by: ${{ github.triggering_actor }}**

            https://github.com/${{ github.repository }}/commit/${{github.event.pull_request.head.sha}}